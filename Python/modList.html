    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrim MOD 列表可视化面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        skyrim: {
                            gold: '#c69b3e',
                            dark: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="min-h-screen pb-12 custom-scrollbar">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-400">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                        Skyrim MOD 列表可视化面板
                    </h1>
                    <p class="text-xs text-slate-400">清晰排版 · 分类管理 · 实时搜索统计</p>
                </div>
            </div>

            <!-- Global Actions & Search -->
            <div class="flex flex-wrap items-center gap-3">
                <div class="relative flex-1 sm:w-64">
                    <input type="text" id="searchInput" placeholder="搜索 MOD 名称..." 
                        class="w-full pl-9 pr-4 py-2 bg-slate-800/80 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <button id="toggleAllBtn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                    <span>全部展开/折叠</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">

        <!-- Stats Bar -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <div class="text-xs font-medium text-slate-400">MOD 总计</div>
                    <div id="statTotal" class="text-2xl font-bold text-slate-100 mt-0.5">0</div>
                </div>
                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>

                </div>

        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
            <div class="flex items-center gap-2">
                <button data-filter="all" class="filter-tab active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 transition">全部 MOD</button>
                <button data-filter="enabled" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">已启用 (+)</button>
                <button data-filter="disabled" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">未启用 (-)</button>
                <button data-filter="special" class="filter-tab px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">DLC / CC (*)</button>
            </div>

                <button id="viewCardBtn" class="px-2.5 py-1 rounded bg-slate-800 text-amber-400 text-xs font-medium flex items-center gap-1">

        </div>

            let currentItems = [];

            totalMods = 0;
            enabledCount = 0;
            disabledCount = 0;
            specialCount = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) return;

                // When encountering a separator, assign all preceding collected items to this separator's name
                if (trimmed.endsWith('_separator')) {
                    const sepName = trimmed.replace('_separator', '').replace(/^[+-]/, '').trim();
                    parsedGroups.push({
                        name: sepName || '未命名分类',
                        items: currentItems
                    });
                    currentItems = [];
                    return;
                }

                let status = 'enabled';
                let rawStatus = trimmed.charAt(0);
                let name = trimmed;

                if (rawStatus === '+') {
                    status = 'enabled';
                    name = trimmed.substring(1);
                    enabledCount++;
                } else if (rawStatus === '-') {
                    status = 'disabled';
                    name = trimmed.substring(1);
                    disabledCount++;
                } else if (rawStatus === '*') {
                    status = 'special';
                    name = trimmed.substring(1);
                    specialCount++;
                } else {
                    status = 'enabled';
                    enabledCount++;
                }

                totalMods++;
                currentItems.push({ raw: trimmed, name, status });
            });

            // Handle any remaining items after the last separator (e.g. Creation Club / DLC / Unmanaged mods)
            if (currentItems.length > 0) {
                parsedGroups.push({
                    name: 'DLC / CC / 原生模组',
                    items: currentItems
                });
            }

            // Update stats DOM
            document.getElementById('statTotal').innerText = totalMods;
            document.getElementById('statEnabled').innerText = enabledCount;
            document.getElementById('statDisabled').innerText = disabledCount;
            document.getElementById('statSpecial').innerText = specialCount;

            // Set raw text view
            document.getElementById('rawOutput').textContent = rawModList;
        }

        function renderVisualView(searchTerm = '') {
            const container = document.getElementById('visualView');
            container.innerHTML = '';

            parsedGroups.forEach((group, index) => {
                const filteredItems = group.items.filter(item => {
                    const matchesFilter = (currentFilter === 'all') || (item.status === currentFilter);
                    const matchesSearch = !searchTerm || item.name.toLowerCase().includes(searchTerm.toLowerCase());
                    return matchesFilter && matchesSearch;
                });

                if (filteredItems.length === 0 && searchTerm) return;

                const groupEl = document.createElement('div');
                groupEl.className = 'bg-slate-900/90 border border-slate-800 rounded-xl overflow-hidden transition';

                const groupId = `group-${index}`;
                
                groupEl.innerHTML = `
                    <div class="group-header px-4 py-3 bg-slate-800/50 hover:bg-slate-800 border-b border-slate-800 cursor-pointer flex items-center justify-between transition" onclick="toggleGroup('${groupId}')">
                        <div class="flex items-center gap-2.5">
                            <svg id="arrow-${groupId}" class="w-4 h-4 text-amber-400 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                            <span class="font-semibold text-sm text-slate-200">${group.name}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-mono">${filteredItems.length} 项</span>
                        </div>
                    </div>
                    <div id="${groupId}" class="group-content p-2 space-y-1">
                        ${filteredItems.map(item => getItemHtml(item)).join('')}
                    </div>
                `;

                container.appendChild(groupEl);
            });
        }

        function getItemHtml(item) {
            let statusBadge = '';
            let borderClass = '';
            let textClass = 'text-slate-200';

            if (item.status === 'enabled') {
                statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>已启用</span>`;
                borderClass = 'border-l-2 border-emerald-500';
            } else if (item.status === 'disabled') {
                statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20"><svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>未启用</span>`;
                borderClass = 'border-l-2 border-rose-500/60 opacity-60';
                textClass = 'text-slate-400 line-through';
            } else {
                statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20"><svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>原生/DLC</span>`;
                borderClass = 'border-l-2 border-purple-500';
            }

            return `
                <div class="flex items-center justify-between px-3 py-1.5 bg-slate-950/40 hover:bg-slate-800/60 rounded ${borderClass} transition">
                    <span class="text-xs font-mono ${textClass} truncate pr-2">${item.name}</span>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        ${statusBadge}
                    </div>
                </div>
            `;
        }

        function toggleGroup(groupId) {
            const content = document.getElementById(groupId);
            const arrow = document.getElementById(`arrow-${groupId}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                arrow.classList.remove('-rotate-90');
            } else {
                content.classList.add('hidden');
                arrow.classList.add('-rotate-90');
            }
        }

        let allExpanded = true;
        document.getElementById('toggleAllBtn').addEventListener('click', () => {
            allExpanded = !allExpanded;
            document.querySelectorAll('.group-content').forEach(content => {
                const groupId = content.id;
                const arrow = document.getElementById(`arrow-${groupId}`);
                if (allExpanded) {
                    content.classList.remove('hidden');
                    if (arrow) arrow.classList.remove('-rotate-90');
                } else {
                    content.classList.add('hidden');
                    if (arrow) arrow.classList.add('-rotate-90');
                }
            });
        });

        // Search listener
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderVisualView(e.target.value.trim());
        });

        // Filter tab listener
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tab').forEach(t => {
                    t.classList.remove('bg-amber-500', 'text-slate-950', 'active', 'font-semibold');
                    t.classList.add('text-slate-400', 'font-medium');
                });
                e.target.classList.add('bg-amber-500', 'text-slate-950', 'active', 'font-semibold');
                e.target.classList.remove('text-slate-400');

                currentFilter = e.target.getAttribute('data-filter');
                renderVisualView(document.getElementById('searchInput').value.trim());
            });
        });

        // View Mode switch
        const viewCardBtn = document.getElementById('viewCardBtn');
        const viewTextBtn = document.getElementById('viewTextBtn');
        const visualView = document.getElementById('visualView');
        const textView = document.getElementById('textView');

        viewCardBtn.addEventListener('click', () => {
            visualView.classList.remove('hidden');
            textView.classList.add('hidden');
            viewCardBtn.className = 'px-2.5 py-1 rounded bg-slate-800 text-amber-400 text-xs font-medium flex items-center gap-1';
            viewTextBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 text-xs font-medium flex items-center gap-1';
        });

        viewTextBtn.addEventListener('click', () => {
            visualView.classList.add('hidden');
            textView.classList.remove('hidden');
            viewTextBtn.className = 'px-2.5 py-1 rounded bg-slate-800 text-amber-400 text-xs font-medium flex items-center gap-1';
            viewCardBtn.className = 'px-2.5 py-1 rounded text-slate-400 hover:text-slate-200 text-xs font-medium flex items-center gap-1';
        });

        // Copy button
        document.getElementById('copyTextBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(rawModList).then(() => {
                alert('已成功复制规整换行后的 MOD 列表文本文档！');
            });
        });

        // Initialize
        parseList();
        renderVisualView();
    </script>
</body>
</html>
